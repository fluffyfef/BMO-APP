<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biotrop CAMM 3 - Controle de Estoque</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ícones (Phosphor) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Biblioteca para ler Excel (SheetJS) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- Configuração de Cores da Biotrop -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        biotrop: {
                            green: {
                                50: '#f0fdf4',
                                100: '#dcfce7',
                                500: '#22c55e',
                                600: '#16a34a',
                                700: '#15803d', // Verde Corporativo
                                800: '#166534',
                                900: '#14532d',
                            }
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #fafaf9; }
        .modal-enter { animation: fadeInScale 0.2s ease-out forwards; }
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        /* Esconder input de arquivo original */
        input[type="file"] { display: none; }
    </style>
</head>
<body class="text-stone-800 selection:bg-biotrop-green-200">

    <!-- CABEÇALHO SUPERIOR -->
    <header class="bg-biotrop-green-800 text-white shadow-lg sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
            
            <!-- Logo e Título -->
            <div class="flex items-center gap-3 w-full md:w-auto">
                <div class="bg-white p-2.5 rounded-xl shadow-sm flex items-center justify-center">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQl4jA6jDbDnf1N0eiR1xPKkhwMrsDvveVOiMm0lcsZow&s=10" alt="Logo Biotrop" class="h-8 w-auto">
                </div>
                <div>
                    <h1 class="text-2xl font-black tracking-tight">BIOTROP <span class="font-light"></span></h1>
                    <p class="text-biotrop-green-200 text-[10px] font-bold tracking-widest uppercase">Estoque em Tempo Real - Manutenção</p>
                </div>
            </div>
            
            <!-- Barra de Busca -->
            <div class="w-full md:w-1/2 relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i class="ph ph-magnifying-glass text-2xl text-biotrop-green-700"></i>
                </div>
                <input
                    type="text"
                    id="searchInput"
                    class="block w-full pl-12 pr-4 py-3.5 border-4 border-transparent rounded-2xl text-lg font-medium text-stone-900 bg-white placeholder-stone-400 focus:outline-none focus:ring-0 focus:border-biotrop-green-400 transition-all shadow-md"
                    placeholder="Buscar por peça, código ou localização..."
                />
            </div>

            <!-- Botões de Ação (Nova Peça e Importar Excel) -->
            <div class="hidden md:flex items-center gap-3 w-full md:w-auto">
                <!-- Botão Importar Excel -->
                <label class="cursor-pointer flex items-center gap-2 bg-stone-100 hover:bg-stone-200 text-stone-700 px-5 py-3.5 rounded-2xl font-bold transition-colors shadow-md border border-stone-300">
                    <i class="ph-bold ph-microsoft-excel-logo text-green-600 text-2xl"></i>
                    <span class="hidden lg:inline">Importar Excel</span>
                    <input type="file" id="excelUpload" accept=".xlsx, .xls, .csv">
                </label>

                <!-- Botão Nova Peça -->
                <button onclick="window.openAddModal()" class="flex items-center gap-2 bg-biotrop-green-600 hover:bg-biotrop-green-500 text-white px-5 py-3.5 rounded-2xl font-bold transition-colors shadow-md border border-biotrop-green-500">
                    <i class="ph ph-plus-circle text-2xl"></i>
                    Nova Peça
                </button>
            </div>
        </div>
    </header>

    <!-- CORPO PRINCIPAL DA PÁGINA -->
    <main class="max-w-7xl mx-auto px-4 py-8 pb-32">
        
        <!-- Status de Conexão Firebase -->
        <div class="flex justify-between items-end mb-6">
            <h2 class="text-2xl font-black text-stone-800 flex items-center gap-2">
                Categorias
                <button id="clearCategoryBtn" class="hidden ml-2 text-sm bg-stone-200 hover:bg-stone-300 text-stone-700 px-4 py-1.5 rounded-full flex items-center gap-1 transition-colors font-bold">
                    Limpar Filtro <i class="ph ph-x"></i>
                </button>
            </h2>
            <div id="connectionStatus" class="flex items-center gap-2 text-sm font-bold text-amber-600 bg-amber-50 px-4 py-2 rounded-full border border-amber-200 shadow-sm">
                <i class="ph-fill ph-spinner animate-spin text-lg"></i> Conectando...
            </div>
        </div>

        <!-- Filtros de Categorias -->
        <section class="mb-10">
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3" id="categoriesContainer">
                <!-- Preenchido via Javascript -->
            </div>
        </section>

        <!-- Lista de Peças -->
        <section>
            <h2 class="text-2xl font-black text-stone-800 mb-6" id="inventoryCount">
                Itens Cadastrados (0)
            </h2>
            
            <div id="inventoryContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Cards renderizados aqui via JS -->
            </div>

            <!-- Tela de "Estoque Vazio" -->
            <div id="emptyState" class="hidden bg-white rounded-3xl p-12 text-center border border-stone-200 shadow-sm mt-6">
                <i class="ph ph-package text-6xl text-stone-300 mx-auto mb-4 block"></i>
                <h3 class="text-2xl font-bold text-stone-600">Nenhuma peça encontrada</h3>
                <p class="text-stone-500 mt-2 font-medium">Tente buscar por outro termo ou cadastre um novo item.</p>
            </div>
        </section>
    </main>

    <!-- Botão Flutuante Mobile para Adicionar Peça -->
    <button onclick="window.openAddModal()" class="md:hidden fixed bottom-6 right-6 w-16 h-16 bg-biotrop-green-600 text-white rounded-full flex items-center justify-center shadow-2xl border-4 border-white hover:bg-biotrop-green-700 transition-transform active:scale-95 z-40">
        <i class="ph ph-plus text-3xl font-bold"></i>
    </button>

    <!-- ========================================== -->
    <!-- MODAL 1: CADASTRAR NOVA PEÇA               -->
    <!-- ========================================== -->
    <div id="addModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-stone-900/70 backdrop-blur-sm overflow-y-auto">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-2xl overflow-hidden modal-enter my-8">
            <div class="p-6 text-white bg-biotrop-green-700 flex justify-between items-center">
                <h3 class="text-2xl font-black flex items-center gap-2">
                    <i class="ph ph-cube"></i> Cadastrar Nova Peça
                </h3>
                <button onclick="window.closeAddModal()" class="text-white/80 hover:text-white bg-white/20 p-2 rounded-full transition-colors">
                    <i class="ph ph-x text-xl"></i>
                </button>
            </div>

            <form id="addItemForm" class="p-6 sm:p-8">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <!-- Nome -->
                    <div class="md:col-span-2">
                        <label class="block text-sm font-bold text-stone-700 mb-2">Nome da Peça *</label>
                        <input type="text" id="formNome" required placeholder="Ex: Contator Trifásico WEG" class="w-full p-4 bg-stone-50 border-2 border-stone-200 rounded-xl font-medium focus:border-biotrop-green-500 outline-none transition-all" />
                    </div>
                    <!-- SKU -->
                    <div>
                        <label class="block text-sm font-bold text-stone-700 mb-2">Código / SKU *</label>
                        <input type="text" id="formSku" required placeholder="Ex: ELE-001" class="w-full p-4 bg-stone-50 border-2 border-stone-200 rounded-xl font-medium focus:border-biotrop-green-500 outline-none transition-all" />
                    </div>
                    <!-- Categoria -->
                    <div>
                        <label class="block text-sm font-bold text-stone-700 mb-2">Categoria *</label>
                        <select id="formCategoria" required class="w-full p-4 bg-stone-50 border-2 border-stone-200 rounded-xl font-medium focus:border-biotrop-green-500 outline-none transition-all">
                            <option value="">Selecione...</option>
                            <option value="Elétrica">Componentes Elétricos</option>
                            <option value="Pneumática">Componentes Pneumáticos</option>
                            <option value="Mecânica">Componentes Mecânicos</option>
                            <option value="Fixação">Elementos de Fixação</option>
                            <option value="Eletrônica">Equipamentos Eletrônicos</option>
                            <option value="Ferramentas">Ferramentas & Consumíveis</option>
                        </select>
                    </div>
                    <!-- Especificação -->
                    <div class="md:col-span-2">
                        <label class="block text-sm font-bold text-stone-700 mb-2">Especificação Técnica</label>
                        <input type="text" id="formSpecs" placeholder="Ex: 32A 24VDC CWB32, M8x20mm..." class="w-full p-4 bg-stone-50 border-2 border-stone-200 rounded-xl font-medium focus:border-biotrop-green-500 outline-none transition-all" />
                    </div>
                    <!-- Localização -->
                    <div class="md:col-span-2">
                        <label class="block text-sm font-bold text-stone-700 mb-2 flex items-center gap-1">
                            <i class="ph-fill ph-map-pin text-amber-500"></i> Localização Exata *
                        </label>
                        <input type="text" id="formLocal" required placeholder="Ex: Corredor A > Estante 3 > Gaveta 12" class="w-full p-4 bg-amber-50 border-2 border-amber-200 rounded-xl font-medium focus:border-amber-500 outline-none text-amber-900 transition-all" />
                    </div>
                    <!-- Qtds -->
                    <div>
                        <label class="block text-sm font-bold text-stone-700 mb-2">Qtd. Atual *</label>
                        <input type="number" id="formQty" required min="0" value="0" class="w-full p-4 bg-stone-50 border-2 border-stone-200 rounded-xl text-xl font-black focus:border-biotrop-green-500 outline-none transition-all" />
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-stone-700 mb-2">Qtd. Mínima *</label>
                        <input type="number" id="formMinQty" required min="0" value="5" class="w-full p-4 bg-stone-50 border-2 border-stone-200 rounded-xl text-xl font-black focus:border-biotrop-green-500 outline-none transition-all" />
                    </div>
                </div>

                <div class="flex gap-4 mt-8 pt-6 border-t border-stone-100">
                    <button type="button" onclick="window.closeAddModal()" class="flex-1 py-4 font-bold text-stone-600 bg-stone-100 hover:bg-stone-200 rounded-xl transition-colors">Cancelar</button>
                    <button type="submit" id="btnSubmitAdd" class="flex-1 py-4 font-black text-white bg-biotrop-green-600 hover:bg-biotrop-green-700 rounded-xl transition-all shadow-md flex items-center justify-center gap-2">
                        <i class="ph-bold ph-check"></i> Salvar Peça
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- MODAL 2: CONFIRMAR EXCLUSÃO                -->
    <!-- ========================================== -->
    <div id="deleteModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-stone-900/80 backdrop-blur-sm">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden modal-enter p-6 text-center">
            <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4 border-4 border-red-50">
                <i class="ph-fill ph-warning-circle text-4xl text-red-500"></i>
            </div>
            <h3 class="text-2xl font-black text-stone-800 mb-2">Atenção!</h3>
            <p class="text-stone-600 font-medium mb-1">Você está prestes a excluir a peça:</p>
            <p id="deleteItemName" class="text-lg font-bold text-red-600 mb-8 p-3 bg-red-50 rounded-xl break-words"></p>
            
            <div class="flex gap-3">
                <button type="button" onclick="window.closeDeleteModal()" class="flex-1 py-4 font-bold text-stone-600 bg-stone-100 hover:bg-stone-200 rounded-xl transition-colors">
                    Cancelar
                </button>
                <button type="button" id="btnConfirmDelete" class="flex-1 py-4 font-black text-white bg-red-500 hover:bg-red-600 rounded-xl transition-all shadow-md flex items-center justify-center gap-2">
                    <i class="ph-bold ph-trash"></i> Sim, Excluir
                </button>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- JAVASCRIPT E CONEXÃO FIREBASE              -->
    <!-- ========================================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCsEIS8RLFMy9p8kQXMRulHshBVrUsjlgA",
  authDomain: "manut-camm3.firebaseapp.com",
  projectId: "manut-camm3",
  storageBucket: "manut-camm3.firebasestorage.app",
  messagingSenderId: "1036619380992",
  appId: "1:1036619380992:web:70e90c5e7d59d3977b1be5",
  measurementId: "G-VRHZJ0PGWY"
};

        let state = {
            inventory: [],
            searchTerm: '',
            activeCategory: null
        };

        const categoriesMap = {
            'Elétrica': { icon: 'ph-lightning', color: 'bg-yellow-100 text-yellow-700 border-yellow-200', name: 'Componentes Elétricos' },
            'Pneumática': { icon: 'ph-wind', color: 'bg-sky-100 text-sky-700 border-sky-200', name: 'Componentes Pneumáticos' },
            'Mecânica': { icon: 'ph-gear', color: 'bg-slate-200 text-slate-700 border-slate-300', name: 'Componentes Mecânicos' },
            'Fixação': { icon: 'ph-link', color: 'bg-stone-200 text-stone-700 border-stone-300', name: 'Elementos de Fixação' },
            'Eletrônica': { icon: 'ph-cpu', color: 'bg-purple-100 text-purple-700 border-purple-200', name: 'Equipamentos Eletrônicos' },
            'Ferramentas': { icon: 'ph-wrench', color: 'bg-orange-100 text-orange-700 border-orange-200', name: 'Ferramentas' },
        };

        let db, itemsCollectionRef;
        let itemToDeleteId = null;

        async function initApp() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                itemsCollectionRef = collection(db, 'estoque');

                // Escutar banco em tempo real
                onSnapshot(itemsCollectionRef, (snapshot) => {
                    state.inventory = [];
                    snapshot.forEach((doc) => {
                        state.inventory.push({ id: doc.id, ...doc.data() });
                    });
                    
                    state.inventory.sort((a, b) => a.nome.localeCompare(b.nome));
                    
                    renderCategories();
                    renderInventory();
                    updateConnectionStatus(true);
                }, (error) => {
                    console.error("Erro no Banco:", error);
                    updateConnectionStatus(false, "Verifique as Regras do Firestore");
                });

                setupEventListeners();

            } catch (error) {
                console.error("Erro de Conexão:", error);
                updateConnectionStatus(false, "Erro nas Credenciais");
            }
        }

        function updateConnectionStatus(isConnected, msg = "") {
            const statusEl = document.getElementById('connectionStatus');
            if (isConnected) {
                statusEl.className = "flex items-center gap-2 text-sm font-bold text-biotrop-green-700 bg-biotrop-green-50 px-4 py-2 rounded-full border border-biotrop-green-200 shadow-sm";
                statusEl.innerHTML = `<i class="ph-fill ph-check-circle text-lg"></i> Online (Tempo Real)`;
            } else {
                statusEl.className = "flex items-center gap-2 text-sm font-bold text-red-600 bg-red-50 px-4 py-2 rounded-full border border-red-200 shadow-sm";
                statusEl.innerHTML = `<i class="ph-fill ph-warning-circle text-lg"></i> ${msg || 'Desconectado'}`;
            }
        }

        function renderCategories() {
            const container = document.getElementById('categoriesContainer');
            container.innerHTML = Object.entries(categoriesMap).map(([key, cat]) => {
                const isActive = state.activeCategory === key;
                return `
                    <button onclick="window.toggleCategory('${key}')" class="flex flex-col items-center justify-center p-4 rounded-3xl border-2 transition-all duration-200 ${isActive ? 'border-biotrop-green-600 bg-biotrop-green-50 shadow-md transform scale-105' : 'bg-white hover:border-biotrop-green-300 border-stone-200'}">
                        <div class="p-3 rounded-2xl mb-3 ${cat.color} bg-opacity-50">
                            <i class="ph-fill ${cat.icon} text-3xl"></i>
                        </div>
                        <span class="text-xs font-bold text-center leading-tight text-stone-700">${cat.name}</span>
                    </button>
                `;
            }).join('');
        }

        function renderInventory() {
            const container = document.getElementById('inventoryContainer');
            const emptyState = document.getElementById('emptyState');
            
            const filtered = state.inventory.filter(item => {
                const searchLower = state.searchTerm.toLowerCase();
                const matchSearch = state.searchTerm === '' || 
                    (item.nome || '').toLowerCase().includes(searchLower) || 
                    (item.sku || '').toLowerCase().includes(searchLower) || 
                    (item.especificacao || '').toLowerCase().includes(searchLower) ||
                    (item.localizacao || '').toLowerCase().includes(searchLower);
                
                const matchCategory = !state.activeCategory || item.categoria === state.activeCategory;
                return matchSearch && matchCategory;
            });

            document.getElementById('inventoryCount').textContent = `Itens Cadastrados (${filtered.length})`;

            if (filtered.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            
            container.innerHTML = filtered.map(item => {
                const qty = parseInt(item.quantidade) || 0;
                const minQty = parseInt(item.quantidadeMinima) || 0;
                const isLowStock = qty <= minQty;
                const catData = categoriesMap[item.categoria] || { icon: 'ph-package', color: 'bg-stone-200 text-stone-700' };

                return `
                    <div class="relative bg-white rounded-3xl p-6 border-2 transition-all hover:shadow-xl flex flex-col h-full ${isLowStock ? 'border-red-400 bg-red-50/40' : 'border-stone-200'}">
                        ${isLowStock ? `<div class="absolute -top-3 -right-3 bg-red-500 text-white px-4 py-1.5 rounded-full text-xs font-black flex items-center gap-1.5 shadow-md z-10 animate-pulse"><i class="ph-bold ph-warning"></i> ESTOQUE BAIXO</div>` : ''}

                        <div class="flex gap-4 mb-5">
                            <div class="w-16 h-16 rounded-2xl flex-shrink-0 flex items-center justify-center ${catData.color}">
                                <i class="ph-fill ${catData.icon} text-3xl"></i>
                            </div>
                            <div class="flex-1 min-w-0">
                                <p class="text-[11px] font-black text-stone-500 mb-1 uppercase tracking-widest truncate">${item.sku}</p>
                                <h3 class="text-xl font-black text-stone-800 leading-tight mb-1 line-clamp-2" title="${item.nome}">${item.nome}</h3>
                                <p class="text-sm font-medium text-stone-500 truncate" title="${item.especificacao}">${item.especificacao}</p>
                            </div>
                        </div>

                        <div class="bg-amber-50 border-2 border-amber-200/60 rounded-xl p-3.5 mb-5 flex items-start gap-3">
                            <i class="ph-fill ph-map-pin text-2xl text-amber-500 mt-0.5 flex-shrink-0"></i>
                            <div>
                                <p class="text-[10px] text-amber-700/80 font-black uppercase mb-1 tracking-wider">Localização Física</p>
                                <p class="text-sm font-bold text-amber-900 leading-tight">${item.localizacao}</p>
                            </div>
                        </div>

                        <div class="mt-auto pt-5 border-t-2 border-stone-100 flex items-center justify-between">
                            <div>
                                <p class="text-[11px] text-stone-400 font-black uppercase tracking-wider mb-1">Em Estoque</p>
                                <div class="flex items-baseline gap-1">
                                    <span class="text-4xl font-black ${isLowStock ? 'text-red-600' : 'text-stone-800'}">${qty}</span>
                                    <span class="text-sm font-medium text-stone-400">/ mín ${minQty}</span>
                                </div>
                            </div>

                            <div class="flex gap-2">
                                <button onclick="window.openDeleteModal('${item.id}', '${item.nome.replace(/'/g, "\\'")}')" class="w-14 h-14 bg-stone-100 text-stone-500 rounded-2xl flex items-center justify-center hover:bg-red-500 hover:text-white active:scale-90 transition-all shadow-sm border border-stone-200" title="Excluir Peça">
                                    <i class="ph-bold ph-trash text-2xl"></i>
                                </button>
                                <button onclick="window.updateQuantity('${item.id}', -1)" class="w-14 h-14 bg-red-100 text-red-600 rounded-2xl flex items-center justify-center hover:bg-red-500 hover:text-white active:scale-90 transition-all shadow-sm border border-red-200" title="Remover 1">
                                    <i class="ph-bold ph-minus text-3xl"></i>
                                </button>
                                <button onclick="window.updateQuantity('${item.id}', 1)" class="w-14 h-14 bg-biotrop-green-100 text-biotrop-green-700 rounded-2xl flex items-center justify-center hover:bg-biotrop-green-600 hover:text-white active:scale-90 transition-all shadow-sm border border-biotrop-green-200" title="Adicionar 1">
                                    <i class="ph-bold ph-plus text-3xl"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function setupEventListeners() {
            // Busca
            document.getElementById('searchInput').addEventListener('input', (e) => {
                state.searchTerm = e.target.value;
                renderInventory();
            });

            // Limpar Filtro
            document.getElementById('clearCategoryBtn').addEventListener('click', () => {
                window.toggleCategory(null);
            });

            // Form de Adicionar
            document.getElementById('addItemForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btnSubmit = document.getElementById('btnSubmitAdd');
                const originalText = btnSubmit.innerHTML;
                btnSubmit.innerHTML = '<i class="ph-bold ph-spinner animate-spin"></i> Salvando...';
                btnSubmit.disabled = true;

                const novoItem = {
                    nome: document.getElementById('formNome').value.trim(),
                    sku: document.getElementById('formSku').value.trim(),
                    categoria: document.getElementById('formCategoria').value,
                    especificacao: document.getElementById('formSpecs').value.trim(),
                    localizacao: document.getElementById('formLocal').value.trim(),
                    quantidade: parseInt(document.getElementById('formQty').value) || 0,
                    quantidadeMinima: parseInt(document.getElementById('formMinQty').value) || 0,
                };

                try {
                    await addDoc(itemsCollectionRef, novoItem);
                    window.closeAddModal();
                    document.getElementById('addItemForm').reset();
                } catch (error) {
                    console.error("Erro ao cadastrar:", error);
                    alert("Erro ao salvar a peça.");
                } finally {
                    btnSubmit.innerHTML = originalText;
                    btnSubmit.disabled = false;
                }
            });

            // Confirmar Exclusão
            document.getElementById('btnConfirmDelete').addEventListener('click', async () => {
                if(!itemToDeleteId) return;
                const btn = document.getElementById('btnConfirmDelete');
                btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin"></i> Excluindo...';
                btn.disabled = true;

                try {
                    await deleteDoc(doc(db, "estoque", itemToDeleteId));
                    window.closeDeleteModal();
                } catch (error) {
                    console.error("Erro ao deletar:", error);
                    alert("Erro ao deletar a peça.");
                } finally {
                    btn.innerHTML = '<i class="ph-bold ph-trash"></i> Sim, Excluir';
                    btn.disabled = false;
                }
            });

            // Importar Excel
            document.getElementById('excelUpload').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if(!file) return;

                const reader = new FileReader();
                reader.onload = async (event) => {
                    const data = new Uint8Array(event.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const itemsExcel = XLSX.utils.sheet_to_json(firstSheet);
                    
                    if(itemsExcel.length === 0) {
                        alert("A planilha parece estar vazia.");
                        return;
                    }
                    
                    if(!confirm(`Deseja importar ${itemsExcel.length} itens do Excel para o banco de dados?`)) {
                        e.target.value = '';
                        return;
                    }

                    // Botão visual de carregando (opcional, pode travar a tela um pouco dependendo do tamanho)
                    document.body.style.cursor = 'wait';

                    for (const row of itemsExcel) {
                        try {
                            const novoItem = {
                                nome: row['Nome'] || 'Item sem nome',
                                sku: row['Código'] || row['Codigo'] || row['SKU'] || '-',
                                categoria: row['Categoria'] || 'Mecânica',
                                especificacao: row['Especificação'] || row['Especificacao'] || '',
                                localizacao: row['Localização'] || row['Localizacao'] || '-',
                                quantidade: parseInt(row['Quantidade']) || parseInt(row['Qtd Atual']) || 0,
                                quantidadeMinima: parseInt(row['Qtd Mínima']) || parseInt(row['Minima']) || 0
                            };
                            await addDoc(itemsCollectionRef, novoItem);
                        } catch(err) {
                            console.error("Erro ao subir linha", row, err);
                        }
                    }
                    document.body.style.cursor = 'default';
                    alert("Importação concluída com sucesso!");
                    e.target.value = ''; 
                };
                reader.readAsArrayBuffer(file);
            });
        }

        // Funções Globais (Window)
        window.toggleCategory = (categoryName) => {
            if (state.activeCategory === categoryName || categoryName === null) {
                state.activeCategory = null;
                document.getElementById('clearCategoryBtn').classList.add('hidden');
            } else {
                state.activeCategory = categoryName;
                document.getElementById('clearCategoryBtn').classList.remove('hidden');
            }
            renderCategories();
            renderInventory();
        };

        window.updateQuantity = async (id, change) => {
            const item = state.inventory.find(i => i.id === id);
            if (!item) return;
            const newQty = parseInt(item.quantidade) + change;
            if (newQty < 0) return; 
            try {
                await updateDoc(doc(db, "estoque", id), { quantidade: newQty });
            } catch (error) {
                console.error("Erro ao atualizar qtde:", error);
            }
        };

        window.openAddModal = () => {
            document.getElementById('addModal').classList.remove('hidden');
            document.getElementById('addModal').classList.add('flex');
        };
        
        window.closeAddModal = () => {
            document.getElementById('addModal').classList.add('hidden');
            document.getElementById('addModal').classList.remove('flex');
        };

        window.openDeleteModal = (id, nome) => {
            itemToDeleteId = id;
            document.getElementById('deleteItemName').textContent = nome;
            const modal = document.getElementById('deleteModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };
        
        window.closeDeleteModal = () => {
            itemToDeleteId = null;
            const modal = document.getElementById('deleteModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        };

        // Inicia o app quando a tela carrega
        window.onload = initApp;
    </script>
</body>
</html>
