<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.M.O. - Bio-Monitoramento Operacional</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Paleta de Cores BMO (Hora de Aventura) */
            --bmo-body: #5DC8B8;       /* Verde-azulado do corpo */
            --bmo-body-dark: #45A395;  /* Sombra do corpo */
            --bmo-screen: #E0F2D8;     /* Verde clarinho da tela */
            --bmo-screen-dark: #B8D6AD;/* Sombra da tela */
            --bmo-yellow: #FFD23F;     /* D-Pad Amarelo */
            --bmo-yellow-dark: #D9AC2A;
            --bmo-blue: #3EBCF0;       /* Botão Triângulo Azul */
            --bmo-red: #FF4A5A;        /* Botão Círculo Vermelho */
            --bmo-red-dark: #D43140;
            --bmo-outline: #153E45;    /* Contorno escuro cartoon */
            
            --text-main: #153E45;
            --text-light: #3A737A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #e5e5e5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Container parecendo o próprio BMO */
        .mobile-container {
            width: 100%;
            max-width: 414px;
            min-height: 95vh;
            background-color: var(--bmo-body);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            position: relative;
            overflow-x: hidden;
            border: 6px solid var(--bmo-outline);
            border-radius: 40px; /* Bordas bem redondas */
            margin: 20px 0;
        }

        /* Top Bar Integrada ao "Corpo" */
        .header {
            padding: 30px 25px 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-text h1 {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--bmo-outline);
            letter-spacing: 1px;
        }

        .header-text p {
            font-size: 0.95rem;
            color: var(--text-main);
            font-weight: 800;
            opacity: 0.85;
            margin-top: -2px;
        }

        .avatar {
            width: 50px;
            height: 50px;
            background-color: var(--bmo-yellow);
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            border: 3px solid var(--bmo-outline);
            border-bottom: 5px solid var(--bmo-outline);
        }

        .dashboard-content {
            padding: 0 20px 30px 20px;
        }

        /* Banner de Status Amarelo do BMO */
        .status-banner {
            background-color: var(--bmo-yellow);
            color: var(--bmo-outline);
            padding: 15px;
            border-radius: 16px;
            text-align: center;
            font-weight: 900;
            font-size: 1.1rem;
            margin-bottom: 25px;
            border: 3px solid var(--bmo-outline);
            border-bottom: 6px solid var(--bmo-outline);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Grid de Cartões imitando as telinhas */
        .grid-sensors {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--bmo-screen);
            padding: 18px 15px;
            border-radius: 20px;
            border: 3px solid var(--bmo-outline);
            border-bottom: 6px solid var(--bmo-outline);
            text-align: center;
            transition: transform 0.1s;
        }

        .card:active {
            transform: translateY(3px);
            border-bottom: 3px solid var(--bmo-outline);
            margin-bottom: 3px;
        }

        .card-icon {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .card h3 {
            font-size: 0.9rem;
            font-weight: 900;
            color: var(--text-light);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card .value {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--text-main);
        }

        .card .unit {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text-light);
        }

        .card-full {
            grid-column: span 2;
            display: flex;
            justify-content: space-around;
            align-items: center;
            text-align: left;
        }

        .card-full .card-icon {
            font-size: 2.5rem;
            margin: 0;
        }

        /* Seção de Controles */
        .controls-section h2 {
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--bmo-outline);
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .control-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bmo-screen);
            padding: 18px 20px;
            border-radius: 20px;
            border: 3px solid var(--bmo-outline);
            border-bottom: 5px solid var(--bmo-outline);
            margin-bottom: 15px;
        }

        .control-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .control-info span {
            font-size: 1.4rem;
        }

        .control-info p {
            font-weight: 900;
            color: var(--text-main);
            font-size: 1.05rem;
        }

        /* Toggle Switch imitando os botões Azul e Vermelho do BMO */
        .switch {
            position: relative;
            display: inline-block;
            width: 58px;
            height: 34px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--bmo-screen-dark);
            transition: .4s;
            border-radius: 34px;
            border: 3px solid var(--bmo-outline);
        }

        /* O "Botão" interno */
        .slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background-color: var(--bmo-red); /* Botão desligado é vermelho */
            transition: .4s;
            border-radius: 50%;
            border: 2px solid var(--bmo-outline);
        }

        input:checked + .slider {
            background-color: var(--bmo-body-dark);
        }

        /* Botão ligado fica Azul */
        input:checked + .slider:before {
            background-color: var(--bmo-blue);
            transform: translateX(24px);
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <!-- Top Bar B.M.O -->
        <div class="header">
            <div class="header-text">
                <h1>B.M.O.</h1>
                <p>Bio-Monitoramento Operacional</p>
            </div>
            <div class="avatar">🎮</div>
        </div>

        <div class="dashboard-content">
            <!-- Banner -->
            <div class="status-banner" id="statusBanner">
                <span>✨</span> Clima Perfeito!
            </div>

            <!-- Cartões de Sensores imitando Telinhas -->
            <div class="grid-sensors">
                <div class="card">
                    <div class="card-icon">🌡️</div>
                    <h3>Temp</h3>
                    <span class="value" id="tempValue">24.5</span><span class="unit">°C</span>
                </div>
                <div class="card">
                    <div class="card-icon">💧</div>
                    <h3>Umidade</h3>
                    <span class="value" id="humValue">85</span><span class="unit">%</span>
                </div>
                <div class="card card-full">
                    <div class="card-icon">🍄</div>
                    <div>
                        <h3>Crescimento / CO2</h3>
                        <span class="value" id="co2Value">750</span><span class="unit"> ppm</span>
                    </div>
                </div>
            </div>

            <!-- Controles Manuais -->
            <div class="controls-section">
                <h2>Controle Manual</h2>
                
                <div class="control-item">
                    <div class="control-info">
                        <span>💦</span>
                        <p>Água</p>
                    </div>
                    <label class="switch">
                        <input type="checkbox" checked id="toggleUmidificador">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="control-item">
                    <div class="control-info">
                        <span>💨</span>
                        <p>Exaustor</p>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="toggleExaustao">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="control-item">
                    <div class="control-info">
                        <span>💡</span>
                        <p>Luz Fria</p>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="toggleLed">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <script>
        function simularDadosIoT() {
            let tempBase = 24.0;
            let humBase = 85;
            let co2Base = 750;

            setInterval(() => {
                let tempAtual = (tempBase + (Math.random() * 1.5 - 0.5)).toFixed(1);
                let humAtual = Math.floor(humBase + (Math.random() * 5 - 2));
                let co2Atual = Math.floor(co2Base + (Math.random() * 50 - 25));

                document.getElementById('tempValue').innerText = tempAtual;
                document.getElementById('humValue').innerText = humAtual;
                document.getElementById('co2Value').innerText = co2Atual;

                let banner = document.getElementById('statusBanner');
                
                // Se o CO2 subir muito, o BMO fica vermelho (Alerta!)
                if (co2Atual > 780) {
                    banner.style.backgroundColor = "var(--bmo-red)";
                    banner.style.borderBottomColor = "var(--bmo-red-dark)";
                    banner.style.color = "#ffffff";
                    banner.innerHTML = "<span>🚨</span> Alerta de CO2!";
                    document.getElementById('toggleExaustao').checked = true;
                } else {
                    banner.style.backgroundColor = "var(--bmo-yellow)";
                    banner.style.borderBottomColor = "var(--bmo-yellow-dark)";
                    banner.style.color = "var(--bmo-outline)";
                    banner.innerHTML = "<span>✨</span> Clima Perfeito!";
                }
            }, 3000);
        }

        window.onload = simularDadosIoT;
    </script>
</body>
</html>
